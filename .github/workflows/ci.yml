name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 单测 / 类型 / 构建 / 包体预算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 单元测试
        run: npm run test
      - name: 类型检查
        run: npx tsc -b
      - name: 构建
        run: npx vite build
      - name: 包体预算门禁（主 chunk ≤110KB / 总 JS ≤230KB gzip）
        run: npm run check:budget

  e2e:
    name: E2E 关键路径（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 运行 E2E（仅关键路径；视觉回归在独立 visual job）
        run: npx playwright test e2e/critical-path.spec.ts
      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: 视觉回归（首月观察期，允许失败）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 运行视觉回归
        run: npx playwright test e2e/visual.spec.ts
      - name: 生成 Linux 基线（--update-snapshots，下载工件后提交回仓库即转真实对比）
        if: failure()
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: 上传 Linux 基线
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: e2e/visual.spec.ts-snapshots/*-linux.png
          retention-days: 30
      - name: 上传差异截图
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse 性能（首月观察期，允许失败）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 构建
        run: npx vite build
      - name: Lighthouse CI（性能 ≥ 0.85）
        run: npx --yes @lhci/cli@0.14.x autorun
