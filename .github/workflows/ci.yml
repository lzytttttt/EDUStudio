name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 单测 / 类型 / 构建 / 包体预算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 单元测试
        run: npm run test
      - name: 类型检查
        run: npx tsc -b
      - name: 构建
        run: npx vite build
      - name: 包体预算门禁（主 chunk ≤110KB / 总 JS ≤230KB gzip）
        run: npm run check:budget

  e2e:
    name: E2E 关键路径（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 运行 E2E
        run: npx playwright test
      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
